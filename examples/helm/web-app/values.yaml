replicaCount: 4

image:
  repository: nginx
  tag: latest
  pullPolicy: Always

serviceAccount:
  create: false
  name: ""

podSecurityContext: {}

securityContext:
  privileged: true
  allowPrivilegeEscalation: true
  capabilities:
    add: ["NET_ADMIN"]

env:
  - name: DB_PASSWORD
    value: "s3cr3t-pass"
  - name: LOG_LEVEL
    value: info

service:
  type: LoadBalancer
  port: 80

admin:
  enabled: true
  serviceType: LoadBalancer

ingress:
  enabled: true
  className: ""
  hosts:
    - host: web.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10

apiKey: "abc123-not-a-real-key"
