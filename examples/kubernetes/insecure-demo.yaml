apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: default
spec:
  template:
    spec:
      hostNetwork: true
      serviceAccountName: default
      automountServiceAccountToken: true
      containers:
        - name: api
          image: myapp:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add: ["NET_ADMIN", "SYS_ADMIN"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: default
spec:
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: default
spec:
  rules:
    - host: api.example.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  database_password: "s3cr3t123"
  api_key: "abcdef123456"
  app_port: "8080"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-pv
  namespace: default
spec:
  hostPath:
    path: /data
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
